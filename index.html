<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AtomFable Hi — Hi 广场</title>
  <meta name="description" content="AtomFable Hi 广场：提意见、灌水、闲聊都行。想说啥说啥，匿名也行。当前为 UI 预览。" />
  <link rel="canonical" href="https://hi.atomfable.com/" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    body {
      background-color: #fcfbf9;
      color: #111827;
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .site-shell-wide {
      width: 100%;
      max-width: 90rem;
      margin-left: auto;
      margin-right: auto;
      padding-left: 1rem;
      padding-right: 1rem;
    }
    @media (min-width: 1280px) {
      .site-shell-wide {
        padding-left: 1.5rem;
        padding-right: 1.5rem;
      }
    }
    :root {
      --hi-content-max: 74.67rem; /* 原 56rem + 1/3 */
      --hi-post-size: 1.0625rem;
      --hi-post-line: 1.72;
    }
    @media (min-width: 768px) {
      :root {
        --hi-post-size: 1.125rem;
      }
    }
    .chat-shell {
      width: 100%;
      max-width: var(--hi-content-max);
      margin-left: auto;
      margin-right: auto;
    }
    .comic-border {
      border: 4px solid #111827 !important;
      box-shadow: 6px 6px 0 #111827 !important;
      border-radius: 4px !important;
      background: #fff;
    }
    .brand-lockup { text-decoration: none; color: inherit; }
    .brand-mark { background: #fff !important; box-sizing: border-box; }
    .header-bar {
      min-height: 4rem;
      padding-top: 0.5rem;
      padding-bottom: 0.5rem;
    }
    @media (min-width: 768px) {
      .header-bar { min-height: 4.75rem; }
    }

    .chat-layout {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }
    .chat-scroll {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 1rem 1rem 1.25rem;
    }
    @media (min-width: 768px) {
      .chat-scroll { padding: 1.25rem 1rem 1.5rem; }
    }

    .msg-item {
      width: 100%;
      padding-bottom: 0.85rem;
    }
    .msg-item + .msg-item {
      padding-top: 0.15rem;
    }
    .msg-divider {
      border: 0;
      border-top: 2px dashed #d1d5db;
      margin: 0.75rem 0 0;
    }
    .msg-row {
      display: flex;
    }
    .msg-row.is-mine {
      justify-content: flex-end;
    }
    .msg-row.is-other {
      justify-content: flex-start;
    }
    .msg-wrap {
      max-width: min(78%, 28rem);
      display: flex;
      flex-direction: column;
    }
    .msg-row.is-mine .msg-wrap {
      align-items: flex-end;
    }
    .msg-row.is-other .msg-wrap {
      align-items: flex-start;
    }
    .msg-label {
      font-size: 0.8125rem;
      font-weight: 700;
      color: #6b7280;
      margin-bottom: 0.25rem;
      padding: 0 0.15rem;
    }
    .msg-row.is-mine .msg-label {
      text-align: right;
      color: #ea580c;
    }
    .msg-row.is-admin .msg-label {
      color: #ea580c;
    }
    .msg-source a {
      color: #ea580c;
      font-weight: 800;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .msg-source a:hover {
      color: #c2410c;
    }
    .msg-label-sep {
      color: #d1d5db;
      font-weight: 700;
    }
    .entry-source-hint {
      font-size: 0.65rem;
      font-weight: 700;
      color: #9ca3af;
      margin-bottom: 0.45rem;
    }
    .entry-source-hint a {
      color: #ea580c;
      font-weight: 800;
      text-decoration: underline;
    }
    .bubble {
      border: 3px solid #111827;
      box-shadow: 4px 4px 0 #111827;
      border-radius: 4px;
      padding: 0.75rem 0.95rem;
      font-size: var(--hi-post-size);
      line-height: var(--hi-post-line);
      font-weight: 500;
      letter-spacing: 0.01em;
      color: #1f2937;
      white-space: pre-wrap;
      word-break: break-word;
      background: #fff;
    }
    .msg-row.is-mine .bubble {
      background: #fff7ed;
      border-color: #ea580c;
      box-shadow: 4px 4px 0 #ea580c;
      color: #111827;
    }
    .msg-row.is-admin .bubble {
      background: #fff7ed;
      border-color: #ea580c;
      box-shadow: 4px 4px 0 #ea580c;
    }
    .msg-time {
      font-size: 0.75rem;
      font-weight: 500;
      color: #9ca3af;
      margin-top: 0.2rem;
      padding: 0 0.15rem;
      display: block;
      width: 100%;
    }
    .msg-row.is-mine .msg-time {
      text-align: right;
    }
    .msg-row.is-other .msg-time {
      text-align: left;
    }

    .header-sub {
      font-size: 0.7rem;
      font-weight: 700;
      color: #9ca3af;
      margin-top: 0.15rem;
    }

    .compose-dock {
      flex-shrink: 0;
      position: relative;
      z-index: 20;
      background: #fff;
      border-top: 4px solid #111827;
      padding: 0.75rem 1rem calc(0.75rem + env(safe-area-inset-bottom, 0px));
    }
    @media (min-width: 768px) {
      .compose-dock { padding: 0.85rem 1rem calc(0.85rem + env(safe-area-inset-bottom, 0px)); }
    }
    .compose-inner {
      max-width: var(--hi-content-max);
      margin: 0 auto;
    }
    .compose-nick-bar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.35rem 0.5rem;
      margin-bottom: 0.5rem;
      font-size: 0.75rem;
      font-weight: 800;
    }
    .compose-nick-label {
      color: #6b7280;
      flex-shrink: 0;
    }
    .nick-display {
      padding: 0.2rem 0.45rem;
      font: inherit;
      font-weight: 800;
      color: #ea580c;
      background: #fff7ed;
      border: 2px solid #111827;
      border-radius: 4px;
      box-shadow: 2px 2px 0 #111827;
      cursor: pointer;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .nick-display:hover {
      background: #ffedd5;
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0 #ea580c;
    }
    .nick-edit {
      flex: 1;
      min-width: 10rem;
      max-width: 100%;
      display: none;
    }
    .nick-edit.is-open {
      display: block;
    }
    .compose-nick-bar.is-editing .nick-display {
      display: none;
    }
    .nick-hint {
      font-size: 0.65rem;
      font-weight: 700;
      color: #9ca3af;
    }
    .compose-nick-bar.is-editing .nick-hint {
      display: none;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .compose-row {
      display: flex;
      align-items: flex-end;
      gap: 0.5rem;
    }
    .compose-input {
      flex: 1;
      min-width: 0;
      padding: 0.6rem 0.75rem;
      font-size: var(--hi-post-size);
      font-weight: 500;
      line-height: var(--hi-post-line);
      min-height: calc(2 * var(--hi-post-line) * 1em + 1.2rem);
      color: #111827;
      background: #fff;
      border: 3px solid #111827;
      border-radius: 4px;
      outline: none;
      resize: none;
      max-height: 9rem;
      line-height: 1.45;
    }
    .compose-input:focus {
      box-shadow: 4px 4px 0 #ea580c;
      background: #fffbeb;
    }
    .compose-input::placeholder {
      color: #9ca3af;
      font-weight: 600;
    }
    .btn-send {
      flex-shrink: 0;
      min-width: 3.5rem;
      height: 3.25rem;
      padding: 0 0.35rem;
      font-size: 0.75rem;
      font-weight: 900;
      border: 3px solid #111827;
      box-shadow: 4px 4px 0 #111827;
      background: #f97316;
      color: #fff;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .btn-send:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 #111827;
      background: #ea580c;
    }
    .btn-send:active {
      transform: translate(1px, 1px);
      box-shadow: 2px 2px 0 #111827;
    }
    .compose-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.4rem;
      font-size: 0.65rem;
      font-weight: 700;
      color: #9ca3af;
    }

    .field-input {
      width: 100%;
      padding: 0.5rem 0.65rem;
      font-size: 0.8125rem;
      font-weight: 600;
      border: 3px solid #111827;
      border-radius: 4px;
      outline: none;
    }
    .field-input:focus {
      box-shadow: 3px 3px 0 #ea580c;
      background: #fffbeb;
    }

    .preview-badge {
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #ea580c;
      background: #fff7ed;
      border: 2px solid #111827;
      padding: 0.2rem 0.45rem;
      border-radius: 4px;
    }
    .btn-comic-link {
      display: inline-flex;
      align-items: center;
      padding: 0.4rem 0.75rem;
      font-size: 0.75rem;
      font-weight: 800;
      border: 3px solid #111827;
      box-shadow: 3px 3px 0 #111827;
      background: #fff;
      color: #111827;
      text-decoration: none;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .btn-comic-link:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0 #ea580c;
      background: #fff7ed;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(6rem + env(safe-area-inset-bottom, 0px));
      z-index: 30;
      max-width: min(20rem, calc(100vw - 2rem));
      padding: 0.65rem 1rem;
      font-size: 0.8125rem;
      font-weight: 700;
      text-align: center;
      background: #fff;
      border: 4px solid #111827;
      box-shadow: 6px 6px 0 #111827;
      transform: translateX(-50%) translateY(0.5rem);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
    }
    .toast.is-show {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
    }
    .stream-empty {
      display: none;
      text-align: center;
      padding: 2rem 1rem;
      font-weight: 700;
      color: #9ca3af;
      font-size: 0.875rem;
    }
    .stream-empty.is-visible { display: block; }
    .stream-loading {
      text-align: center;
      padding: 1.5rem 1rem;
      font-weight: 700;
      color: #9ca3af;
      font-size: 0.875rem;
    }
    .stream-loading.hidden { display: none; }
    .btn-send:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
      box-shadow: 4px 4px 0 #111827;
    }
  </style>
</head>
<body class="h-[100dvh] flex flex-col overflow-hidden m-0">

  <header class="bg-white border-b-4 border-gray-900 shrink-0 z-50">
    <div class="site-shell-wide header-bar flex items-center justify-between gap-3">
      <a href="https://atomfable.com/zh/" class="brand-lockup flex items-center gap-2.5 shrink-0">
        <span class="brand-mark w-10 h-10 md:w-11 md:h-11 comic-border shrink-0" aria-hidden="true"></span>
        <span class="block leading-none">
          <span class="text-xl md:text-2xl font-black tracking-tight">
            AtomFable <span class="text-orange-600">Hi</span>
          </span>
          <span class="header-sub block">Hi 广场 · 共 <span id="msg-total">0</span> 条</span>
        </span>
      </a>
      <div class="flex items-center gap-2 sm:gap-3 shrink-0">
        <a href="https://atomfable.com/zh/" class="btn-comic-link">← 主站</a>
      </div>
    </div>
  </header>

  <main class="chat-layout flex-1 min-h-0">
    <div id="chat-scroll" class="chat-scroll chat-shell" tabindex="-1">
      <p class="stream-loading hidden" id="stream-loading">加载留言中…</p>
      <p class="stream-empty" id="stream-empty">Hi 广场还空着，来抢第一条吧。</p>
      <div id="msg-stream" role="log" aria-live="polite" aria-relevant="additions"></div>
    </div>

    <div class="compose-dock" role="region" aria-label="在 Hi 广场说两句">
      <div class="compose-inner">
        <form id="guestbook-form" novalidate>
          <p class="entry-source-hint hidden" id="entry-source-hint"></p>
          <div class="compose-nick-bar" id="nick-bar">
            <span class="compose-nick-label">昵称</span>
            <button type="button" class="nick-display" id="nick-display" title="点击修改昵称"></button>
            <span class="nick-hint">· 点击可改</span>
            <label for="nick" class="sr-only">昵称</label>
            <input
              type="text"
              id="nick"
              name="nick"
              maxlength="20"
              class="field-input nick-edit"
              autocomplete="nickname"
            />
          </div>
          <div class="compose-row">
            <label for="content" class="sr-only">内容</label>
            <textarea
              id="content"
              name="content"
              rows="2"
              maxlength="500"
              required
              placeholder="提意见、灌水、闲聊都行～说说你想玩的工具，或给主站 / Hi 广场提个想法"
              class="compose-input"
            ></textarea>
            <button type="submit" class="btn-send" id="btn-send" aria-label="说两句">说两句</button>
          </div>
          <div class="compose-meta">
            <span><span id="char-count">0</span> / 500</span>
            <span id="compose-status">留言会保存在云端</span>
          </div>
        </form>
      </div>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script>
    const SOURCE_MAP = {
      "main-zh": { label: "主站", url: "https://atomfable.com/zh/" },
      "main-en": { label: "Main site", url: "https://atomfable.com/" },
      base64: { label: "Base64 工具", url: "https://base64.atomfable.com/" },
      image: { label: "图片压缩", url: "https://image.atomfable.com/" },
    };
    const ENTRY_SOURCE_KEY = "hi-entry-source";

    let messages = [];
    let isPosting = false;

    const chatScroll = document.getElementById("chat-scroll");
    const msgStream = document.getElementById("msg-stream");
    const msgTotal = document.getElementById("msg-total");
    const streamLoading = document.getElementById("stream-loading");
    const streamEmpty = document.getElementById("stream-empty");
    const btnSend = document.getElementById("btn-send");
    const form = document.getElementById("guestbook-form");
    const contentEl = document.getElementById("content");
    const charCount = document.getElementById("char-count");
    const toast = document.getElementById("toast");
    const nickBar = document.getElementById("nick-bar");
    const nickDisplay = document.getElementById("nick-display");
    const nickInput = document.getElementById("nick");
    const entrySourceHint = document.getElementById("entry-source-hint");
    const NICK_PREFIX = "路过的热心网友";
    const NICK_STORAGE_KEY = "hi-display-nick";
    const CLIENT_TOKEN_KEY = "hi-client-token";
    const API_MESSAGES = "/api/messages";
    let toastTimer;
    let myClientToken = "";

    function resolveSourceFromCode(code) {
      const key = (code || "").trim().toLowerCase();
      if (!key || !SOURCE_MAP[key]) return null;
      return { id: key, label: SOURCE_MAP[key].label, url: SOURCE_MAP[key].url };
    }

    function resolveSourceFromReferrer() {
      try {
        const ref = document.referrer;
        if (!ref) return null;
        const host = new URL(ref).hostname.replace(/^www\./, "");
        if (host === "atomfable.com") {
          return ref.includes("/zh")
            ? { id: "referrer-main-zh", label: "主站", url: "https://atomfable.com/zh/" }
            : { id: "referrer-main-en", label: "Main site", url: "https://atomfable.com/" };
        }
        if (host === "base64.atomfable.com") {
          return { id: "referrer-base64", label: "Base64 工具", url: "https://base64.atomfable.com/" };
        }
        if (host === "image.atomfable.com") {
          return { id: "referrer-image", label: "图片压缩", url: "https://image.atomfable.com/" };
        }
      } catch (_) {}
      return null;
    }

    function detectEntrySource() {
      const fromParam = new URLSearchParams(location.search).get("from");
      return resolveSourceFromCode(fromParam) || resolveSourceFromReferrer();
    }

    function getCurrentSource() {
      try {
        const raw = sessionStorage.getItem(ENTRY_SOURCE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && parsed.url && parsed.label) return parsed;
        }
      } catch (_) {}
      return detectEntrySource();
    }

    function persistEntrySource(source) {
      if (!source) return;
      try { sessionStorage.setItem(ENTRY_SOURCE_KEY, JSON.stringify(source)); } catch (_) {}
    }

    function updateEntrySourceHint() {
      const source = getCurrentSource();
      if (!source || !entrySourceHint) return;
      const label = escapeHtml(source.label);
      const url = escapeHtml(source.url);
      entrySourceHint.innerHTML = `你这条将显示为：来自 <a href="${url}" target="_blank" rel="noopener noreferrer">${label}</a>`;
      entrySourceHint.classList.remove("hidden");
    }

    function randomGuestNick() {
      const n = Math.floor(1000 + Math.random() * 9000);
      return `${NICK_PREFIX}${n}`;
    }

    function syncNickUI(value) {
      const nick = (value || "").trim() || randomGuestNick();
      nickInput.value = nick;
      nickDisplay.textContent = nick;
    }

    function openNickEdit() {
      nickBar.classList.add("is-editing");
      nickInput.classList.add("is-open");
      nickInput.focus();
      nickInput.select();
    }

    function closeNickEdit(save) {
      if (save) {
        const trimmed = nickInput.value.trim();
        if (trimmed) {
          syncNickUI(trimmed);
          try { localStorage.setItem(NICK_STORAGE_KEY, trimmed); } catch (_) {}
        } else {
          syncNickUI(nickDisplay.textContent);
        }
      } else {
        syncNickUI(nickDisplay.textContent);
      }
      nickBar.classList.remove("is-editing");
      nickInput.classList.remove("is-open");
    }

    function getSendNick() {
      return nickInput.value.trim() || nickDisplay.textContent.trim() || randomGuestNick();
    }

    (function initNick() {
      try {
        const saved = localStorage.getItem(NICK_STORAGE_KEY);
        if (saved && saved.trim()) {
          syncNickUI(saved.trim());
          return;
        }
      } catch (_) {}
      syncNickUI(randomGuestNick());
    })();

    nickDisplay.addEventListener("click", openNickEdit);
    nickInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        closeNickEdit(true);
      } else if (e.key === "Escape") {
        closeNickEdit(false);
      }
    });
    nickInput.addEventListener("blur", () => closeNickEdit(true));

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function formatMessageTime(iso) {
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return "";
      const now = new Date();
      const sameDay =
        d.getFullYear() === now.getFullYear() &&
        d.getMonth() === now.getMonth() &&
        d.getDate() === now.getDate();
      const hm = `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
      if (sameDay) return hm;
      return `${d.getMonth() + 1}/${d.getDate()} ${hm}`;
    }

    function getClientToken() {
      try {
        let token = localStorage.getItem(CLIENT_TOKEN_KEY);
        if (
          token &&
          /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(token)
        ) {
          return token;
        }
        token = crypto.randomUUID();
        localStorage.setItem(CLIENT_TOKEN_KEY, token);
        return token;
      } catch (_) {
        return "";
      }
    }

    function mapApiMessage(row) {
      const token = myClientToken || getClientToken();
      myClientToken = token;
      const source =
        row.source_label && row.source_url
          ? { label: row.source_label, url: row.source_url }
          : null;
      return {
        floor: row.id,
        nick: row.nick,
        admin: Boolean(row.is_admin),
        mine: Boolean(token && row.client_token && row.client_token === token),
        content: row.content,
        time: formatMessageTime(row.created_at),
        source,
      };
    }

    async function loadMessages() {
      streamLoading.classList.remove("hidden");
      try {
        const res = await fetch(API_MESSAGES);
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          console.error("GET /api/messages failed", res.status, data);
          if (data.error === "server_not_configured") {
            showToast("后端未配置：请在 Vercel 填 Supabase 环境变量");
          } else if (data.error === "wrong_key_role") {
            showToast("误用了 anon 密钥，请改 service_role");
          } else if (data.hint) {
            showToast(data.hint);
          } else {
            showToast("加载失败，稍后再试");
          }
          messages = [];
          renderMessages(messages);
          return;
        }
        messages = (data.messages || []).map(mapApiMessage);
        renderMessages(messages);
      } catch (_) {
        showToast("网络异常，加载失败");
        messages = [];
        renderMessages(messages);
      } finally {
        streamLoading.classList.add("hidden");
      }
    }

    function scrollToBottom(smooth) {
      requestAnimationFrame(() => {
        chatScroll.scrollTo({
          top: chatScroll.scrollHeight,
          behavior: smooth ? "smooth" : "auto",
        });
      });
    }

    function renderSourcePrefix(m) {
      if (!m.source || !m.source.url || !m.source.label) return "";
      const label = escapeHtml(m.source.label);
      const url = escapeHtml(m.source.url);
      return `<span class="msg-source">来自 <a href="${url}" target="_blank" rel="noopener noreferrer">${label}</a></span><span class="msg-label-sep" aria-hidden="true"> · </span>`;
    }

    function renderBubble(m) {
      const side = m.mine ? "is-mine" : "is-other";
      const adminCls = m.admin && !m.mine ? " is-admin" : "";
      const label = escapeHtml(m.nick);
      const sourcePrefix = renderSourcePrefix(m);
      return `
        <div class="msg-item">
        <div class="msg-row ${side}${adminCls}" role="article" aria-label="${escapeHtml(m.nick)}：${escapeHtml(m.content).slice(0, 24)}">
          <div class="msg-wrap">
            <div class="msg-label">${sourcePrefix}${label} · #${m.floor}</div>
            <div class="bubble">${escapeHtml(m.content)}</div>
              <time class="msg-time">${escapeHtml(m.time)}</time>
            </div>
          </div>
          <hr class="msg-divider" />
        </div>`;
    }

    function renderMessages(list) {
      if (!list.length) {
        msgStream.innerHTML = "";
        streamEmpty.classList.add("is-visible");
        msgTotal.textContent = "0";
        return;
      }
      streamEmpty.classList.remove("is-visible");
      msgStream.innerHTML = list.map(renderBubble).join("");
      msgTotal.textContent = String(list.length);
      scrollToBottom(false);
    }

    function showToast(text) {
      toast.textContent = text;
      toast.hidden = false;
      toast.classList.add("is-show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove("is-show");
        toast.hidden = true;
        toast.textContent = "";
      }, 2400);
    }

    function autoGrowTextarea() {
      contentEl.style.height = "auto";
      const minH = parseFloat(getComputedStyle(contentEl).minHeight) || 72;
      contentEl.style.height = `${Math.max(minH, Math.min(contentEl.scrollHeight, 144))}px`;
    }

    (function initEntrySource() {
      const detected = detectEntrySource();
      if (detected) persistEntrySource(detected);
      updateEntrySourceHint();
    })();

    myClientToken = getClientToken();
    loadMessages();

    contentEl.addEventListener("input", () => {
      charCount.textContent = String(contentEl.value.length);
      autoGrowTextarea();
    });

    contentEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (isPosting) return;
      const text = contentEl.value.trim();
      if (!text) {
        showToast("先写点内容");
        contentEl.focus();
        return;
      }
      const source = getCurrentSource();
      const payload = {
        nick: getSendNick(),
        content: text,
        client_token: myClientToken || getClientToken(),
        source_label: source ? source.label : null,
        source_url: source ? source.url : null,
      };

      isPosting = true;
      btnSend.disabled = true;
      try {
        const res = await fetch(API_MESSAGES, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          console.error("POST /api/messages failed", res.status, data);
          if (data.error === "rate_limited") {
            showToast("发太快了，稍后再试");
          } else if (data.error === "turnstile_failed") {
            showToast("人机验证未通过");
          } else if (data.error === "server_not_configured") {
            showToast("后端未配置，请联系站长");
          } else if (data.error === "wrong_key_role") {
            showToast("误用了 anon 密钥，请改 service_role");
          } else if (data.hint) {
            showToast(data.hint);
          } else if (data.error === "insert_failed") {
            showToast("写入失败：请确认 Supabase 已执行建表 SQL");
          } else {
            showToast("发送失败，稍后再试");
          }
          return;
        }
        const row = data.message;
        if (row) {
          messages = [...messages, mapApiMessage(row)];
          renderMessages(messages);
        } else {
          await loadMessages();
        }
        contentEl.value = "";
        charCount.textContent = "0";
        contentEl.style.height = "";
        autoGrowTextarea();
        scrollToBottom(true);
        showToast("已发到 Hi 广场");
      } catch (_) {
        showToast("网络异常，发送失败");
      } finally {
        isPosting = false;
        btnSend.disabled = false;
      }
    });

    window.addEventListener("load", () => {
      autoGrowTextarea();
    });
  </script>
</body>
</html>
