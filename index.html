<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AtomFable Hi — Hi 广场</title>
  <meta name="description" content="AtomFable Hi 广场：提意见、灌水、闲聊都行。想说啥说啥，匿名也行。当前为 UI 预览。" />
  <link rel="canonical" href="https://hi.atomfable.com/" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    body {
      background-color: #fcfbf9;
      color: #111827;
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .site-shell-wide {
      width: 100%;
      max-width: 90rem;
      margin-left: auto;
      margin-right: auto;
      padding-left: 1rem;
      padding-right: 1rem;
    }
    @media (min-width: 1280px) {
      .site-shell-wide {
        padding-left: 1.5rem;
        padding-right: 1.5rem;
      }
    }
    :root {
      --hi-content-max: 74.67rem; /* 原 56rem + 1/3 */
      --hi-post-size: 1.0625rem;
      --hi-post-line: 1.72;
    }
    @media (min-width: 768px) {
      :root {
        --hi-post-size: 1.125rem;
      }
    }
    .chat-shell {
      width: 100%;
      max-width: var(--hi-content-max);
      margin-left: auto;
      margin-right: auto;
    }
    .comic-border {
      border: 4px solid #111827 !important;
      box-shadow: 6px 6px 0 #111827 !important;
      border-radius: 4px !important;
      background: #fff;
    }
    .brand-lockup { text-decoration: none; color: inherit; }
    .brand-mark { background: #fff !important; box-sizing: border-box; }
    .header-bar {
      min-height: 4rem;
      padding-top: 0.5rem;
      padding-bottom: 0.5rem;
    }
    @media (min-width: 768px) {
      .header-bar { min-height: 4.75rem; }
    }

    .chat-layout {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }
    .chat-scroll {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 1rem 1rem 1.25rem;
    }
    @media (min-width: 768px) {
      .chat-scroll { padding: 1.25rem 1rem 1.5rem; }
    }

    .msg-item {
      width: 100%;
      padding-bottom: 0.85rem;
    }
    .msg-item + .msg-item {
      padding-top: 0.15rem;
    }
    .msg-divider {
      border: 0;
      border-top: 2px dashed #d1d5db;
      margin: 0.75rem 0 0;
    }
    .msg-row {
      display: flex;
    }
    .msg-row.is-mine {
      justify-content: flex-end;
    }
    .msg-row.is-other {
      justify-content: flex-start;
    }
    .msg-wrap {
      max-width: min(78%, 28rem);
      display: flex;
      flex-direction: column;
    }
    .msg-row.is-mine .msg-wrap {
      align-items: flex-end;
    }
    .msg-row.is-other .msg-wrap {
      align-items: flex-start;
    }
    .msg-label {
      font-size: 0.8125rem;
      font-weight: 700;
      color: #6b7280;
      margin-bottom: 0.25rem;
      padding: 0 0.15rem;
    }
    .msg-row.is-mine .msg-label {
      text-align: right;
      color: #ea580c;
    }
    .msg-row.is-admin .msg-label {
      color: #ea580c;
    }
    .bubble {
      border: 3px solid #111827;
      box-shadow: 4px 4px 0 #111827;
      border-radius: 4px;
      padding: 0.75rem 0.95rem;
      font-size: var(--hi-post-size);
      line-height: var(--hi-post-line);
      font-weight: 500;
      letter-spacing: 0.01em;
      color: #1f2937;
      white-space: pre-wrap;
      word-break: break-word;
      background: #fff;
    }
    .msg-row.is-mine .bubble {
      background: #fff7ed;
      border-color: #ea580c;
      box-shadow: 4px 4px 0 #ea580c;
      color: #111827;
    }
    .msg-row.is-admin .bubble {
      background: #fff7ed;
      border-color: #ea580c;
      box-shadow: 4px 4px 0 #ea580c;
    }
    .msg-time {
      font-size: 0.75rem;
      font-weight: 500;
      color: #9ca3af;
      margin-top: 0.2rem;
      padding: 0 0.15rem;
      display: block;
      width: 100%;
    }
    .msg-row.is-mine .msg-time {
      text-align: right;
    }
    .msg-row.is-other .msg-time {
      text-align: left;
    }

    .header-sub {
      font-size: 0.7rem;
      font-weight: 700;
      color: #9ca3af;
      margin-top: 0.15rem;
    }

    .compose-dock {
      flex-shrink: 0;
      position: relative;
      z-index: 20;
      background: #fff;
      border-top: 4px solid #111827;
      padding: 0.75rem 1rem calc(0.75rem + env(safe-area-inset-bottom, 0px));
    }
    @media (min-width: 768px) {
      .compose-dock { padding: 0.85rem 1rem calc(0.85rem + env(safe-area-inset-bottom, 0px)); }
    }
    .compose-inner {
      max-width: var(--hi-content-max);
      margin: 0 auto;
    }
    .compose-nick-bar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.35rem 0.5rem;
      margin-bottom: 0.5rem;
      font-size: 0.75rem;
      font-weight: 800;
    }
    .compose-nick-label {
      color: #6b7280;
      flex-shrink: 0;
    }
    .nick-display {
      padding: 0.2rem 0.45rem;
      font: inherit;
      font-weight: 800;
      color: #ea580c;
      background: #fff7ed;
      border: 2px solid #111827;
      border-radius: 4px;
      box-shadow: 2px 2px 0 #111827;
      cursor: pointer;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .nick-display:hover {
      background: #ffedd5;
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0 #ea580c;
    }
    .nick-edit {
      flex: 1;
      min-width: 10rem;
      max-width: 100%;
      display: none;
    }
    .nick-edit.is-open {
      display: block;
    }
    .compose-nick-bar.is-editing .nick-display {
      display: none;
    }
    .nick-hint {
      font-size: 0.65rem;
      font-weight: 700;
      color: #9ca3af;
    }
    .compose-nick-bar.is-editing .nick-hint {
      display: none;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .compose-row {
      display: flex;
      align-items: flex-end;
      gap: 0.5rem;
    }
    .compose-input {
      flex: 1;
      min-width: 0;
      padding: 0.6rem 0.75rem;
      font-size: var(--hi-post-size);
      font-weight: 500;
      line-height: var(--hi-post-line);
      min-height: calc(2 * var(--hi-post-line) * 1em + 1.2rem);
      color: #111827;
      background: #fff;
      border: 3px solid #111827;
      border-radius: 4px;
      outline: none;
      resize: none;
      max-height: 9rem;
      line-height: 1.45;
    }
    .compose-input:focus {
      box-shadow: 4px 4px 0 #ea580c;
      background: #fffbeb;
    }
    .compose-input::placeholder {
      color: #9ca3af;
      font-weight: 600;
    }
    .btn-send {
      flex-shrink: 0;
      min-width: 3.5rem;
      height: 3.25rem;
      padding: 0 0.35rem;
      font-size: 0.75rem;
      font-weight: 900;
      border: 3px solid #111827;
      box-shadow: 4px 4px 0 #111827;
      background: #f97316;
      color: #fff;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .btn-send:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 #111827;
      background: #ea580c;
    }
    .btn-send:active {
      transform: translate(1px, 1px);
      box-shadow: 2px 2px 0 #111827;
    }
    .compose-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.4rem;
      font-size: 0.65rem;
      font-weight: 700;
      color: #9ca3af;
    }

    .field-input {
      width: 100%;
      padding: 0.5rem 0.65rem;
      font-size: 0.8125rem;
      font-weight: 600;
      border: 3px solid #111827;
      border-radius: 4px;
      outline: none;
    }
    .field-input:focus {
      box-shadow: 3px 3px 0 #ea580c;
      background: #fffbeb;
    }

    .preview-badge {
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #ea580c;
      background: #fff7ed;
      border: 2px solid #111827;
      padding: 0.2rem 0.45rem;
      border-radius: 4px;
    }
    .btn-comic-link {
      display: inline-flex;
      align-items: center;
      padding: 0.4rem 0.75rem;
      font-size: 0.75rem;
      font-weight: 800;
      border: 3px solid #111827;
      box-shadow: 3px 3px 0 #111827;
      background: #fff;
      color: #111827;
      text-decoration: none;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .btn-comic-link:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0 #ea580c;
      background: #fff7ed;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(6rem + env(safe-area-inset-bottom, 0px));
      z-index: 30;
      max-width: min(20rem, calc(100vw - 2rem));
      padding: 0.65rem 1rem;
      font-size: 0.8125rem;
      font-weight: 700;
      text-align: center;
      background: #fff;
      border: 4px solid #111827;
      box-shadow: 6px 6px 0 #111827;
      transform: translateX(-50%) translateY(0.5rem);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
    }
    .toast.is-show {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
    }
    .stream-empty {
      display: none;
      text-align: center;
      padding: 2rem 1rem;
      font-weight: 700;
      color: #9ca3af;
      font-size: 0.875rem;
    }
    .stream-empty.is-visible { display: block; }
  </style>
</head>
<body class="h-[100dvh] flex flex-col overflow-hidden m-0">

  <header class="bg-white border-b-4 border-gray-900 shrink-0 z-50">
    <div class="site-shell-wide header-bar flex items-center justify-between gap-3">
      <a href="https://atomfable.com/zh/" class="brand-lockup flex items-center gap-2.5 shrink-0">
        <span class="brand-mark w-10 h-10 md:w-11 md:h-11 comic-border shrink-0" aria-hidden="true"></span>
        <span class="block leading-none">
          <span class="text-xl md:text-2xl font-black tracking-tight">
            AtomFable <span class="text-orange-600">Hi</span>
          </span>
          <span class="header-sub block">Hi 广场 · 共 <span id="msg-total">0</span> 条</span>
        </span>
      </a>
      <div class="flex items-center gap-2 sm:gap-3 shrink-0">
        <span class="preview-badge hidden sm:inline">UI 预览</span>
        <a href="https://atomfable.com/zh/" class="btn-comic-link">← 主站</a>
      </div>
    </div>
  </header>

  <main class="chat-layout flex-1 min-h-0">
    <div id="chat-scroll" class="chat-scroll chat-shell" tabindex="-1">
      <p class="stream-empty" id="stream-empty">Hi 广场还空着，来抢第一条吧。</p>
      <div id="msg-stream" role="log" aria-live="polite" aria-relevant="additions"></div>
    </div>

    <div class="compose-dock" role="region" aria-label="在 Hi 广场说两句">
      <div class="compose-inner">
        <form id="guestbook-form" novalidate>
          <div class="compose-nick-bar" id="nick-bar">
            <span class="compose-nick-label">昵称</span>
            <button type="button" class="nick-display" id="nick-display" title="点击修改昵称"></button>
            <span class="nick-hint">· 点击可改</span>
            <label for="nick" class="sr-only">昵称</label>
            <input
              type="text"
              id="nick"
              name="nick"
              maxlength="20"
              class="field-input nick-edit"
              autocomplete="nickname"
            />
          </div>
          <div class="compose-row">
            <label for="content" class="sr-only">内容</label>
            <textarea
              id="content"
              name="content"
              rows="2"
              maxlength="500"
              required
              placeholder="提意见、灌水、闲聊都行～说说你想玩的工具，或给主站 / Hi 广场提个想法（演示版刷新会丢）"
              class="compose-input"
            ></textarea>
            <button type="submit" class="btn-send" aria-label="说两句">说两句</button>
          </div>
          <div class="compose-meta">
            <span><span id="char-count">0</span> / 500</span>
            <span>演示版 · 刷新页面会丢</span>
          </div>
        </form>
      </div>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script>
    const SAMPLE_MESSAGES = [
      { floor: 1, nick: "AtomFable", admin: true, mine: false, content: "【站长】一楼留给官方：正式开门后会删掉这些假数据。", time: "5/13 00:00" },
      { floor: 2, nick: "工具人", admin: false, mine: false, content: "Base64 那个工具好用，收藏了。期待更多沙雕小工具。", time: "5/14 09:45" },
      { floor: 3, nick: "老网民", admin: false, mine: false, content: "左右分边这种布局顺眼，像聊天又不像微信那种绿泡泡。", time: "5/15 12:30" },
      { floor: 4, nick: "AtomFable", admin: true, mine: false, content: "【站长】Hi 广场 UI 按主站风格重做了，后端还没接。欢迎催更。", time: "5/16 18:00" },
      { floor: 5, nick: "路过网友", admin: false, mine: false, content: "匿名测试一条，应该在左边。", time: "昨天 21:03" },
      { floor: 6, nick: "深夜打工人", admin: false, mine: false, content: "主站那个会跑的 e 太魔性了……", time: "昨天 02:14" },
      { floor: 7, nick: "路过的热心网友520", admin: false, mine: true, content: "演示：自己发的在右边，默认昵称带随机数。", time: "刚刚" },
    ];

    let messages = [...SAMPLE_MESSAGES];
    let nextFloor = 8;

    const chatScroll = document.getElementById("chat-scroll");
    const msgStream = document.getElementById("msg-stream");
    const msgTotal = document.getElementById("msg-total");
    const streamEmpty = document.getElementById("stream-empty");
    const form = document.getElementById("guestbook-form");
    const contentEl = document.getElementById("content");
    const charCount = document.getElementById("char-count");
    const toast = document.getElementById("toast");
    const nickBar = document.getElementById("nick-bar");
    const nickDisplay = document.getElementById("nick-display");
    const nickInput = document.getElementById("nick");
    const NICK_PREFIX = "路过的热心网友";
    const NICK_STORAGE_KEY = "hi-display-nick";
    let toastTimer;

    function randomGuestNick() {
      const n = Math.floor(1000 + Math.random() * 9000);
      return `${NICK_PREFIX}${n}`;
    }

    function syncNickUI(value) {
      const nick = (value || "").trim() || randomGuestNick();
      nickInput.value = nick;
      nickDisplay.textContent = nick;
    }

    function openNickEdit() {
      nickBar.classList.add("is-editing");
      nickInput.classList.add("is-open");
      nickInput.focus();
      nickInput.select();
    }

    function closeNickEdit(save) {
      if (save) {
        const trimmed = nickInput.value.trim();
        if (trimmed) {
          syncNickUI(trimmed);
          try { localStorage.setItem(NICK_STORAGE_KEY, trimmed); } catch (_) {}
        } else {
          syncNickUI(nickDisplay.textContent);
        }
      } else {
        syncNickUI(nickDisplay.textContent);
      }
      nickBar.classList.remove("is-editing");
      nickInput.classList.remove("is-open");
    }

    function getSendNick() {
      return nickInput.value.trim() || nickDisplay.textContent.trim() || randomGuestNick();
    }

    (function initNick() {
      try {
        const saved = localStorage.getItem(NICK_STORAGE_KEY);
        if (saved && saved.trim()) {
          syncNickUI(saved.trim());
          return;
        }
      } catch (_) {}
      syncNickUI(randomGuestNick());
    })();

    nickDisplay.addEventListener("click", openNickEdit);
    nickInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        closeNickEdit(true);
      } else if (e.key === "Escape") {
        closeNickEdit(false);
      }
    });
    nickInput.addEventListener("blur", () => closeNickEdit(true));

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function formatNow() {
      const d = new Date();
      return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
    }

    function scrollToBottom(smooth) {
      requestAnimationFrame(() => {
        chatScroll.scrollTo({
          top: chatScroll.scrollHeight,
          behavior: smooth ? "smooth" : "auto",
        });
      });
    }

    function renderBubble(m) {
      const side = m.mine ? "is-mine" : "is-other";
      const adminCls = m.admin && !m.mine ? " is-admin" : "";
      const label = escapeHtml(m.nick);
      return `
        <div class="msg-item">
        <div class="msg-row ${side}${adminCls}" role="article" aria-label="${escapeHtml(m.nick)}：${escapeHtml(m.content).slice(0, 24)}">
          <div class="msg-wrap">
            <div class="msg-label">${label} · #${m.floor}</div>
            <div class="bubble">${escapeHtml(m.content)}</div>
              <time class="msg-time">${escapeHtml(m.time)}</time>
            </div>
          </div>
          <hr class="msg-divider" />
        </div>`;
    }

    function renderMessages(list) {
      if (!list.length) {
        msgStream.innerHTML = "";
        streamEmpty.classList.add("is-visible");
        msgTotal.textContent = "0";
        return;
      }
      streamEmpty.classList.remove("is-visible");
      msgStream.innerHTML = list.map(renderBubble).join("");
      msgTotal.textContent = String(list.length);
      scrollToBottom(false);
    }

    function showToast(text) {
      toast.textContent = text;
      toast.hidden = false;
      toast.classList.add("is-show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove("is-show");
        toast.hidden = true;
        toast.textContent = "";
      }, 2400);
    }

    function autoGrowTextarea() {
      contentEl.style.height = "auto";
      const minH = parseFloat(getComputedStyle(contentEl).minHeight) || 72;
      contentEl.style.height = `${Math.max(minH, Math.min(contentEl.scrollHeight, 144))}px`;
    }

    renderMessages(messages);

    contentEl.addEventListener("input", () => {
      charCount.textContent = String(contentEl.value.length);
      autoGrowTextarea();
    });

    contentEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = contentEl.value.trim();
      if (!text) {
        showToast("先写点内容");
        contentEl.focus();
        return;
      }
      const msg = {
        floor: nextFloor++,
        nick: getSendNick(),
        admin: false,
        mine: true,
        content: text,
        time: formatNow(),
      };
      messages = [...messages, msg];
      renderMessages(messages);
      contentEl.value = "";
      charCount.textContent = "0";
      contentEl.style.height = "";
      autoGrowTextarea();
      scrollToBottom(true);
      showToast("已发到 Hi 广场（演示版，刷新会丢）");
    });

    window.addEventListener("load", () => {
      autoGrowTextarea();
      scrollToBottom(false);
    });
  </script>
</body>
</html>
