<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AtomFable Hi — Hi 广场</title>
  <meta name="description" content="AtomFable Hi 广场：提意见、灌水、闲聊都行。想说啥说啥，匿名也行。当前为 UI 预览。" />
  <link rel="canonical" href="https://hi.atomfable.com/zh/" />
  <link rel="alternate" hreflang="en" href="https://hi.atomfable.com/" />
  <link rel="alternate" hreflang="zh-CN" href="https://hi.atomfable.com/zh/" />
  <link rel="alternate" hreflang="x-default" href="https://hi.atomfable.com/" />
  <script src="/assets/hi-lang-redirect.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    body {
      background-color: #fcfbf9;
      color: #111827;
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .site-shell-wide {
      width: 100%;
      max-width: 90rem;
      margin-left: auto;
      margin-right: auto;
      padding-left: 1rem;
      padding-right: 1rem;
    }
    @media (min-width: 1280px) {
      .site-shell-wide {
        padding-left: 1.5rem;
        padding-right: 1.5rem;
      }
    }
    :root {
      --hi-content-max: 74.67rem; /* 原 56rem + 1/3 */
      --hi-post-size: 1.0625rem;
      --hi-post-line: 1.72;
    }
    @media (min-width: 768px) {
      :root {
        --hi-post-size: 1.125rem;
      }
    }
    .chat-shell {
      width: 100%;
      max-width: var(--hi-content-max);
      margin-left: auto;
      margin-right: auto;
    }
    .comic-border {
      border: 4px solid #111827 !important;
      box-shadow: 6px 6px 0 #111827 !important;
      border-radius: 4px !important;
      background: #fff;
    }
    .brand-lockup { text-decoration: none; color: inherit; }
    .brand-mark { background: #fff !important; box-sizing: border-box; }
    .header-bar {
      min-height: 4rem;
      padding-top: 0.5rem;
      padding-bottom: 0.5rem;
    }
    @media (min-width: 768px) {
      .header-bar { min-height: 4.75rem; }
    }

    .chat-layout {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }
    .chat-scroll {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 1rem 1rem 1.25rem;
    }
    @media (min-width: 768px) {
      .chat-scroll { padding: 1.25rem 1rem 1.5rem; }
    }

    .msg-item {
      width: 100%;
      padding-bottom: 0.85rem;
    }
    .msg-item + .msg-item {
      padding-top: 0.15rem;
    }
    .msg-divider {
      border: 0;
      border-top: 2px dashed #d1d5db;
      margin: 0.75rem 0 0;
    }
    .msg-row {
      display: flex;
    }
    .msg-row.is-mine {
      justify-content: flex-end;
    }
    .msg-row.is-other {
      justify-content: flex-start;
    }
    .msg-wrap {
      max-width: min(78%, 28rem);
      display: flex;
      flex-direction: column;
    }
    .msg-row.is-mine .msg-wrap {
      align-items: flex-end;
    }
    .msg-row.is-other .msg-wrap {
      align-items: flex-start;
    }
    .msg-label {
      font-size: 0.8125rem;
      font-weight: 700;
      color: #6b7280;
      margin-bottom: 0.25rem;
      padding: 0 0.15rem;
    }
    .msg-row.is-mine .msg-label {
      text-align: right;
      color: #ea580c;
    }
    .msg-row.is-admin .msg-label {
      color: #ea580c;
    }
    .msg-source a {
      color: #ea580c;
      font-weight: 800;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .msg-source a:hover {
      color: #c2410c;
    }
    .msg-label-sep {
      color: #d1d5db;
      font-weight: 700;
    }
    .entry-source-hint {
      font-size: 0.65rem;
      font-weight: 700;
      color: #9ca3af;
      margin-bottom: 0.45rem;
    }
    .entry-source-hint a {
      color: #ea580c;
      font-weight: 800;
      text-decoration: underline;
    }
    .bubble {
      border: 3px solid #111827;
      box-shadow: 4px 4px 0 #111827;
      border-radius: 4px;
      padding: 0.75rem 0.95rem;
      font-size: var(--hi-post-size);
      line-height: var(--hi-post-line);
      font-weight: 500;
      letter-spacing: 0.01em;
      color: #1f2937;
      white-space: pre-wrap;
      word-break: break-word;
      background: #fff;
    }
    .msg-row.is-mine .bubble {
      background: #fff7ed;
      border-color: #ea580c;
      box-shadow: 4px 4px 0 #ea580c;
      color: #111827;
    }
    .msg-row.is-admin .bubble {
      background: #fff7ed;
      border-color: #ea580c;
      box-shadow: 4px 4px 0 #ea580c;
    }
    .msg-time {
      font-size: 0.75rem;
      font-weight: 500;
      color: #9ca3af;
      margin-top: 0.2rem;
      padding: 0 0.15rem;
      display: block;
      width: 100%;
    }
    .msg-row.is-mine .msg-time {
      text-align: right;
    }
    .msg-row.is-other .msg-time {
      text-align: left;
    }
    .msg-actions {
      margin-top: 0.35rem;
      display: flex;
      gap: 0.5rem;
    }
    .msg-row.is-mine .msg-actions {
      justify-content: flex-end;
    }
    .msg-delete {
      font-size: 0.7rem;
      font-weight: 800;
      color: #b91c1c;
      background: #fff;
      border: 2px solid #b91c1c;
      box-shadow: 2px 2px 0 #b91c1c;
      border-radius: 2px;
      padding: 0.1rem 0.45rem;
      cursor: pointer;
    }
    .msg-delete:hover {
      background: #fef2f2;
    }
    .btn-admin-toggle {
      font-size: 0.65rem;
      font-weight: 800;
      color: #9ca3af;
      text-decoration: underline;
      text-underline-offset: 2px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
    }
    .btn-admin-toggle.is-on {
      color: #ea580c;
    }

    .header-sub {
      font-size: 0.7rem;
      font-weight: 700;
      color: #9ca3af;
      margin-top: 0.15rem;
    }

    .compose-dock {
      flex-shrink: 0;
      position: relative;
      z-index: 20;
      background: #fff;
      border-top: 4px solid #111827;
      padding: 0.75rem 1rem calc(0.75rem + env(safe-area-inset-bottom, 0px));
    }
    @media (min-width: 768px) {
      .compose-dock { padding: 0.85rem 1rem calc(0.85rem + env(safe-area-inset-bottom, 0px)); }
    }
    .compose-inner {
      max-width: var(--hi-content-max);
      margin: 0 auto;
    }
    .compose-nick-bar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.35rem 0.5rem;
      margin-bottom: 0.5rem;
      font-size: 0.75rem;
      font-weight: 800;
      cursor: pointer;
    }
    .compose-nick-label {
      color: #6b7280;
      flex-shrink: 0;
    }
    .nick-display {
      padding: 0.35rem 0.65rem;
      font: inherit;
      font-size: inherit;
      font-weight: 800;
      line-height: 1.3;
      color: #ea580c;
      background: #fff7ed;
      border: 2px solid #111827;
      border-radius: 4px;
      box-shadow: 2px 2px 0 #111827;
      cursor: pointer;
      min-height: 1.75rem;
      min-width: 6.5rem;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      appearance: none;
      -webkit-appearance: none;
    }
    .nick-display:hover {
      background: #ffedd5;
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0 #ea580c;
    }
    .nick-edit {
      flex: 1;
      min-width: 10rem;
      max-width: 100%;
      display: none;
    }
    .nick-edit.is-open {
      display: block;
    }
    .compose-nick-bar.is-editing .nick-display {
      display: none;
    }
    .nick-hint {
      font-size: 0.65rem;
      font-weight: 700;
      color: #9ca3af;
    }
    .compose-nick-bar.is-editing .nick-hint {
      display: none;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .compose-row {
      display: flex;
      align-items: flex-end;
      gap: 0.5rem;
    }
    .compose-input {
      flex: 1;
      min-width: 0;
      padding: 0.6rem 0.75rem;
      font-size: var(--hi-post-size);
      font-weight: 500;
      line-height: var(--hi-post-line);
      min-height: calc(2 * var(--hi-post-line) * 1em + 1.2rem);
      color: #111827;
      background: #fff;
      border: 3px solid #111827;
      border-radius: 4px;
      outline: none;
      resize: none;
      max-height: 9rem;
      line-height: 1.45;
    }
    .compose-input:focus {
      box-shadow: 4px 4px 0 #ea580c;
      background: #fffbeb;
    }
    .compose-input::placeholder {
      color: #9ca3af;
      font-weight: 600;
    }
    .btn-send {
      flex-shrink: 0;
      min-width: 3.5rem;
      height: 3.25rem;
      padding: 0 0.35rem;
      font-size: 0.75rem;
      font-weight: 900;
      border: 3px solid #111827;
      box-shadow: 4px 4px 0 #111827;
      background: #f97316;
      color: #fff;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .btn-send:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 #111827;
      background: #ea580c;
    }
    .btn-send:active {
      transform: translate(1px, 1px);
      box-shadow: 2px 2px 0 #111827;
    }
    .compose-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.4rem;
      font-size: 0.65rem;
      font-weight: 700;
      color: #9ca3af;
    }

    .field-input {
      width: 100%;
      padding: 0.5rem 0.65rem;
      font-size: 0.8125rem;
      font-weight: 600;
      border: 3px solid #111827;
      border-radius: 4px;
      outline: none;
    }
    .field-input:focus {
      box-shadow: 3px 3px 0 #ea580c;
      background: #fffbeb;
    }

    .preview-badge {
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #ea580c;
      background: #fff7ed;
      border: 2px solid #111827;
      padding: 0.2rem 0.45rem;
      border-radius: 4px;
    }
    .btn-comic-link {
      display: inline-flex;
      align-items: center;
      padding: 0.4rem 0.75rem;
      font-size: 0.75rem;
      font-weight: 800;
      border: 3px solid #111827;
      box-shadow: 3px 3px 0 #111827;
      background: #fff;
      color: #111827;
      text-decoration: none;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .btn-comic-link:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0 #ea580c;
      background: #fff7ed;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(6rem + env(safe-area-inset-bottom, 0px));
      z-index: 30;
      max-width: min(20rem, calc(100vw - 2rem));
      padding: 0.65rem 1rem;
      font-size: 0.8125rem;
      font-weight: 700;
      text-align: center;
      background: #fff;
      border: 4px solid #111827;
      box-shadow: 6px 6px 0 #111827;
      transform: translateX(-50%) translateY(0.5rem);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
    }
    .toast.is-show {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
    }
    .stream-empty {
      display: none;
      text-align: center;
      padding: 2rem 1rem;
      font-weight: 700;
      color: #9ca3af;
      font-size: 0.875rem;
    }
    .stream-empty.is-visible { display: block; }
    .stream-loading {
      text-align: center;
      padding: 1.5rem 1rem;
      font-weight: 700;
      color: #9ca3af;
      font-size: 0.875rem;
    }
    .stream-loading.hidden { display: none; }
    .btn-send:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
      box-shadow: 4px 4px 0 #111827;
    }
    .lang-switch {
      display: none;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.75rem;
      font-weight: 800;
      flex-shrink: 0;
    }
    .lang-switch a {
      text-decoration: none;
      color: #6b7280;
    }
    .lang-switch a.is-active {
      color: #ea580c;
    }
    .lang-switch a:hover {
      color: #ea580c;
    }
    @media (min-width: 768px) {
      .lang-switch { display: flex; }
    }
  </style>
</head>
<body class="h-[100dvh] flex flex-col overflow-hidden m-0">

  <header class="bg-white border-b-4 border-gray-900 shrink-0 z-50">
    <div class="site-shell-wide header-bar flex items-center justify-between gap-3">
      <a href="https://atomfable.com/zh/" class="brand-lockup flex items-center gap-2.5 shrink-0">
        <span class="brand-mark w-10 h-10 md:w-11 md:h-11 comic-border shrink-0" aria-hidden="true"></span>
        <span class="block leading-none">
          <span class="text-xl md:text-2xl font-black tracking-tight">
            AtomFable <span class="text-orange-600">Hi</span>
          </span>
          <span class="header-sub block" id="header-sub">Hi 广场 · 共 0 条</span>
        </span>
      </a>
      <div class="flex items-center gap-2 sm:gap-3 shrink-0">
        <nav class="lang-switch" aria-label="语言">
          <a href="/" data-set-lang="en" lang="en">EN</a>
          <span class="text-gray-400" aria-hidden="true">|</span>
          <a href="/zh/" class="is-active" data-set-lang="zh" lang="zh-CN">中文</a>
        </nav>
        <a href="https://atomfable.com/zh/" class="btn-comic-link">← 主站</a>
      </div>
    </div>
  </header>

  <main class="chat-layout flex-1 min-h-0">
    <div id="chat-scroll" class="chat-scroll chat-shell" tabindex="-1">
      <p class="stream-loading hidden" id="stream-loading">加载留言中…</p>
      <p class="stream-empty" id="stream-empty">Hi 广场还空着，来抢第一条吧。</p>
      <div id="msg-stream" role="log" aria-live="polite" aria-relevant="additions"></div>
    </div>

    <div class="compose-dock" role="region" aria-label="在 Hi 广场说两句">
      <div class="compose-inner">
        <form id="guestbook-form" novalidate>
          <p class="entry-source-hint hidden" id="entry-source-hint"></p>
          <div class="compose-nick-bar" id="nick-bar">
            <span class="compose-nick-label">昵称</span>
            <button type="button" class="nick-display" id="nick-display" title="点击修改昵称">路过的热心网友</button>
            <span class="nick-hint">· 点击可改</span>
            <label for="nick" class="sr-only">昵称</label>
            <input
              type="text"
              id="nick"
              name="nick"
              maxlength="20"
              class="field-input nick-edit"
              autocomplete="nickname"
            />
          </div>
          <div class="compose-row">
            <label for="content" class="sr-only">内容</label>
            <textarea
              id="content"
              name="content"
              rows="2"
              maxlength="500"
              required
              placeholder="提意见、灌水、闲聊都行～说说你想玩的工具，或给主站 / Hi 广场提个想法"
              class="compose-input"
            ></textarea>
            <button type="submit" class="btn-send" id="btn-send" aria-label="说两句">说两句</button>
          </div>
          <div class="compose-meta">
            <span><span id="char-count">0</span> / 500</span>
            <span id="compose-status">留言会保存在云端</span>
            <button type="button" class="btn-admin-toggle" id="btn-admin-toggle">站长</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script>window.HI_PAGE_LANG = "zh";</script>
  <script src="/assets/hi-i18n.js"></script>
  <script src="/assets/hi-nick-bootstrap.js"></script>
  <script src="/assets/hi-app.js"></script>
</body>
</html>
